---
- name: Install mise (macOS)
  community.general.homebrew:
    name: mise
    state: present
  when: ansible_os_family == "Darwin"

- name: Install mise (Linux)
  ansible.builtin.shell: |
    curl https://mise.run | sh
  args:
    creates: "{{ ansible_env.HOME }}/.local/bin/mise"
  when: ansible_os_family != "Darwin"

# Install every tool pinned in ~/.config/mise/config.toml (stowed by the
# dotfiles role). Prebuilt binaries where possible; Python/Ruby are compiled
# from source when a project sets a version via `mise use`.
- name: Install tools from mise global config
  ansible.builtin.command: mise install
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/bin:/opt/homebrew/bin:/usr/local/bin:{{ ansible_env.PATH }}"
  changed_when: false
