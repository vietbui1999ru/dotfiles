---
- name: Install mise (macOS)
  community.general.homebrew:
    name: mise
    state: present
  when: ansible_os_family == "Darwin"

- name: Install mise (Linux)
  ansible.builtin.shell: |
    curl https://mise.run | sh
  args:
    creates: "{{ ansible_env.HOME }}/.local/bin/mise"
  when: ansible_os_family != "Darwin"

# Install every tool pinned in ~/.config/mise/config.toml. That config is stowed
# by the dotfiles role (the `mise` stow package), so it must already be in place.
- name: Install mise tools
  ansible.builtin.command: mise install
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/bin:/opt/homebrew/bin:/usr/local/bin:{{ ansible_env.PATH }}"
  changed_when: false
