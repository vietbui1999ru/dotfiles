---
# The agents role is Linux-only. macOS already gets pueue, Pi and qmd from Homebrew
# and the Mac's own setup, so the whole role is skipped there.
- name: Check agents role runs on Linux only
  ansible.builtin.assert:
    that: ansible_os_family != "Darwin"
    fail_msg: "agents role is for Linux boxes; macOS installs these through its own setup"
    quiet: true

# pueue (task queue). The real binaries go in /usr/local/bin, mirroring Homebrew's
# pueue on the Mac: bootstrap-dirs.sh links ~/.local/bin/pueue (earlier on PATH) to
# the secret-scrubbing wrapper scripts/pueue-safe, which finds the real binary by
# searching PATH past itself. Skipped on lite boxes. No service is installed;
# dispatch starts pueued.
- name: Fetch the latest pueue release tag
  ansible.builtin.uri:
    url: https://api.github.com/repos/Nukesor/pueue/releases/latest
    return_content: true
  register: agents_pueue_release
  when: not agent_lite | bool

- name: Install pueue and pueued from the GitHub release
  ansible.builtin.get_url:
    url: "https://github.com/Nukesor/pueue/releases/download/{{ agents_pueue_release.json.tag_name }}/{{ item }}-{{ agents_linux_triple }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
  become: true
  loop:
    - pueue
    - pueued
  when: not agent_lite | bool

# Pi (coding agent). Installed from npm with the mise-pinned node; the packages it
# uses (pi-lens, context-mode) are pulled by Pi itself from its settings.json.
- name: Install Pi coding agent (npm global)
  ansible.builtin.shell: |
    mise x -- npm install -g @earendil-works/pi-coding-agent
    mise reshim
  args:
    creates: "{{ ansible_env.HOME }}/.local/share/mise/shims/pi"
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.HOME }}/.local/share/mise/shims:{{ ansible_env.PATH }}"
  when: not agent_lite | bool

# qmd (local markdown search). Installed on every box, lite included. Keyword
# search (qmd search) works without models; vector search needs `qmd embed`.
- name: Install qmd (npm global)
  ansible.builtin.shell: |
    mise x -- npm install -g @tobilu/qmd
    mise reshim
  args:
    creates: "{{ ansible_env.HOME }}/.local/share/mise/shims/qmd"
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.HOME }}/.local/share/mise/shims:{{ ansible_env.PATH }}"

- name: Check that the llm-wiki checkout exists
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/repos/llm-wiki"
  register: agents_wiki_dir

- name: Note that the qmd collection is skipped without the wiki
  ansible.builtin.debug:
    msg: >-
      ~/repos/llm-wiki is missing, so no qmd collection was registered. Check out
      the llm-wiki submodule (or clone it there) and rerun this role.
  when: not agents_wiki_dir.stat.exists

- name: List registered qmd collections
  ansible.builtin.command: qmd collection list
  register: agents_qmd_collections
  changed_when: false
  when: agents_wiki_dir.stat.exists
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.HOME }}/.local/share/mise/shims:{{ ansible_env.PATH }}"

- name: Register the llm-wiki qmd collection
  ansible.builtin.command: >-
    qmd collection add {{ ansible_env.HOME }}/repos/llm-wiki --name wiki
  when:
    - agents_wiki_dir.stat.exists
    - "'wiki (' not in agents_qmd_collections.stdout"
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.HOME }}/.local/share/mise/shims:{{ ansible_env.PATH }}"

# Index only. `qmd embed` downloads ~2 GB of models and is never run here: on lite
# boxes it is disabled outright, and on full boxes it is the user's call.
- name: Refresh qmd index (keyword only)
  ansible.builtin.command: qmd update
  changed_when: false
  when: agents_wiki_dir.stat.exists
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.HOME }}/.local/share/mise/shims:{{ ansible_env.PATH }}"

- name: Note that vector embeddings are not built
  ansible.builtin.debug:
    msg: >-
      qmd embed is not run by this role. Keyword search works now; run
      'qmd embed' yourself on a full box for vector search (about 2 GB of models).
  when: not agent_lite | bool

# Headroom CLI, proxy and MCP server (`[all]`), as a uv tool on Python 3.13.
# The proxy itself runs from systemd/headroom-proxy.service and
# systemd/headroom-zen.service (see below), bound to 127.0.0.1. Expose it to other
# machines only through `tailscale serve` (HTTPS, tailnet-only), never as plain HTTP on a LAN address.
- name: Install Headroom (uv tool, servers only)
  ansible.builtin.command: >-
    mise x -- uv tool install --python 3.13 "headroom-ai[all]"
  args:
    creates: "{{ ansible_env.HOME }}/.local/bin/headroom"
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.HOME }}/.local/share/mise/shims:{{ ansible_env.PATH }}"
  when: agents_headroom_enabled | bool

# The user units are linked one file at a time rather than stowed: linking the
# whole systemd/ folder into ~/.config/systemd/user would turn every file in the
# repo directory into a unit.
- name: Ensure ~/.config/systemd/user exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/systemd/user"
    state: directory
    mode: "0755"
  when: agents_headroom_enabled | bool

- name: Link the Headroom user units
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/dotfiles/systemd/{{ item }}"
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/{{ item }}"
    state: link
    force: true
  loop:
    - headroom-proxy.service
    - headroom-zen.service
  when: agents_headroom_enabled | bool

# Molecule containers and WSL2 without systemd have no /run/systemd/system, and
# nothing below can work there. The units are still linked, so they start on a
# later boot of a real systemd box.
- name: Check whether systemd is running
  ansible.builtin.stat:
    path: /run/systemd/system
  register: agents_systemd_running

- name: Note that the Headroom user services were not started
  ansible.builtin.debug:
    msg: >-
      /run/systemd/system is missing, so the Headroom user units were linked but
      not started or enabled, and no client was pointed at the proxy. Rerun this
      role on a box that boots systemd.
  when:
    - agents_headroom_enabled | bool
    - not agents_systemd_running.stat.exists

# Without linger the user manager stops at logout, which is exactly what a
# headless box never does in practice and WSL2 does after the last shell.
- name: Read the current linger setting
  ansible.builtin.command: loginctl show-user {{ ansible_user_id }} -p Linger
  register: agents_linger
  changed_when: false
  failed_when: false
  when:
    - agents_headroom_enabled | bool
    - agents_systemd_running.stat.exists

- name: Keep the user manager running without a login session
  ansible.builtin.command: loginctl enable-linger {{ ansible_user_id }}
  when:
    - agents_headroom_enabled | bool
    - agents_systemd_running.stat.exists
    - agents_linger.rc == 0
    - "'Linger=yes' not in agents_linger.stdout"

- name: Start the Headroom user services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: user
    daemon_reload: true
    enabled: true
    state: started
  loop:
    - headroom-proxy.service
    - headroom-zen.service
  when:
    - agents_headroom_enabled | bool
    - agents_systemd_running.stat.exists

# Pi has no env override for a provider base URL, so its route lives in
# ~/.pi/agent/models.json. The generator reads Pi's own catalog, which only
# exists once Pi has run.
- name: Check Pi's model catalog
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.pi/agent/models-store.json"
  register: agents_pi_models_store
  when:
    - agents_headroom_enabled | bool
    - not agent_lite | bool
    - agents_systemd_running.stat.exists

- name: Note that Pi keeps the direct opencode-go route
  ansible.builtin.debug:
    msg: >-
      ~/.pi/agent/models-store.json is missing, so scripts/pi-headroom-models was
      not run and Pi keeps talking to Zen Go directly. Run Pi once, then rerun
      this role.
  when:
    - agents_headroom_enabled | bool
    - not agent_lite | bool
    - agents_systemd_running.stat.exists
    - not agents_pi_models_store.stat.exists

# The script rewrites models.json with the same bytes when nothing changed, so
# the role is idempotent by content and reports no change.
- name: Route Pi's opencode-go provider through the Zen proxy
  ansible.builtin.command:
    cmd: "{{ ansible_env.HOME }}/dotfiles/scripts/pi-headroom-models"
  changed_when: false
  when:
    - agents_headroom_enabled | bool
    - not agent_lite | bool
    - agents_systemd_running.stat.exists
    - agents_pi_models_store.stat.exists

- name: Ensure ~/secrets exists (owner-only)
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/secrets"
    state: directory
    mode: "0700"

# Secrets are never copied by the playbook.
- name: Remind to copy secrets by hand
  ansible.builtin.debug:
    msg: >-
      Copy these by hand; the playbook never handles secrets:
      ~/secrets/.env and ~/.pi/agent/auth.json.
