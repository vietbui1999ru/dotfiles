---
- name: Check dotfiles_git_transport is a known transport
  ansible.builtin.assert:
    that: dotfiles_git_transport in ['ssh', 'https']
    fail_msg: "dotfiles_git_transport must be 'ssh' or 'https', got '{{ dotfiles_git_transport }}'"
    quiet: true

- name: Clone dotfiles repo
  ansible.builtin.git:
    repo: >-
      {{ 'https://github.com/vietbui1999ru/dotfiles.git'
         if dotfiles_git_transport == 'https'
         else 'git@github.com:vietbui1999ru/dotfiles.git' }}
    dest: "{{ ansible_env.HOME }}/dotfiles"
    version: main
    depth: 1
    update: false
  when: dotfiles_clone_enabled

- name: Init and update git submodules (llm-wiki)
  ansible.builtin.command:
    argv: "{{ ['git'] + dotfiles_submodule_url_rewrite + ['submodule', 'update', '--init', '--recursive'] }}"
    chdir: "{{ ansible_env.HOME }}/dotfiles"
  vars:
    # .gitmodules pins the submodule to the SSH URL; rewrite it per command
    # rather than touching the user's global git config.
    dotfiles_submodule_url_rewrite: >-
      {{ ['-c', 'url.https://github.com/.insteadOf=git@github.com:']
         if dotfiles_git_transport == 'https' else [] }}
  changed_when: false
  when: dotfiles_submodule_enabled

- name: Bootstrap expected directories and symlinks
  ansible.builtin.command:
    cmd: "{{ ansible_env.HOME }}/dotfiles/scripts/bootstrap-dirs.sh"
  changed_when: false

# bootstrap-dirs.sh renders opencode.json as a real file when it is absent, which
# blocks stowing the opencode package on a fresh box. The Mac links the template
# instead, so move the rendered copy aside (never delete it) and let stow link it.
- name: Check for a rendered opencode.json
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.config/opencode/opencode.json"
  register: dotfiles_opencode_json
  when: "'opencode' in dotfiles_stow_packages"

- name: Move the rendered opencode.json aside so stow can link the template
  ansible.builtin.command: >-
    mv {{ ansible_env.HOME }}/.config/opencode/opencode.json
    {{ ansible_env.HOME }}/.config/opencode/opencode.json.pre-stow
  changed_when: true
  when:
    - "'opencode' in dotfiles_stow_packages"
    - dotfiles_opencode_json.stat.exists | default(false)
    - dotfiles_opencode_json.stat.isreg | default(false)

- name: Stow all packages
  ansible.builtin.shell: |
    cd {{ ansible_env.HOME }}/dotfiles
    stow --target="{{ ansible_env.HOME }}" --restow {{ item }}
  loop: "{{ dotfiles_stow_packages }}"
  register: dotfiles_stow_result
  changed_when: dotfiles_stow_result.stdout != ""
