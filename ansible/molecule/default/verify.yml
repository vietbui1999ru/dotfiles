---
- name: Verify
  hosts: all
  gather_facts: true  # later tasks read ansible_env
  vars:
    verify_bins:
      - zsh
      - starship
      - tmux
      - nvim
      - cargo
      - go
      - mise
      - rg
      - fzf
      - lazygit
      - jq
      - gh
      - yq
    verify_symlinks:
      - .zshrc
      - .tmux.conf
      - .config/starship.toml
      - .config/nvim
  tasks:
    - name: Check expected binaries are on PATH
      # PATH is built from the remote $HOME in the shell, which keeps the
      # check independent of facts.
      ansible.builtin.shell: >-
        PATH="$HOME/.local/bin:$HOME/.cargo/bin:/usr/local/go/bin:$PATH"
        command -v {{ item }}
      args:
        executable: /bin/bash
      # The lite box has no rust toolchain by design.
      loop: "{{ verify_bins | reject('equalto', 'cargo' if inventory_hostname == 'debian12-lite' else '') | list }}"
      register: verify_bin_check
      changed_when: false

    - name: Check key stow symlinks exist
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/{{ item }}"
      loop: "{{ verify_symlinks }}"
      register: verify_symlink_check

    - name: Assert symlinks resolved into ~/dotfiles
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.islnk
        fail_msg: "{{ item.item }} is missing or not a symlink"
      loop: "{{ verify_symlink_check.results }}"
      loop_control:
        label: "{{ item.item }}"

- name: Verify Linux agent box
  hosts: agent_linux
  gather_facts: true  # later tasks read ansible_env
  vars:
    agent_bins_always:
      - qmd
      - rtk
      - jj
      - stow
    agent_bins_full:
      - pi
      - pueue
    # herdr is stowed on agent boxes only.
    verify_symlinks:
      - .config/herdr/config.toml
  tasks:
    - name: Check always-on agent binaries resolve
      ansible.builtin.shell: "command -v {{ item }}"
      args:
        executable: /bin/bash
      environment:
        PATH: "{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.HOME }}/.local/share/mise/shims:{{ ansible_env.PATH }}"
      loop: "{{ agent_bins_always }}"
      register: agent_bin_check
      changed_when: false

    - name: Check key stow symlinks exist
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/{{ item }}"
      loop: "{{ verify_symlinks }}"
      register: agent_symlink_check

    - name: Assert agent symlinks resolved into ~/dotfiles
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.islnk
        fail_msg: "{{ item.item }} is missing or not a symlink"
      loop: "{{ agent_symlink_check.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check ~/.config/herdr is a real folder
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.config/herdr"
      register: agent_herdr_dir

    # A linked folder makes herdr write its sockets, logs and session*.json into
    # ~/dotfiles/herdr/ instead of the live config directory.
    - name: Assert ~/.config/herdr is a directory, not a stow link
      ansible.builtin.assert:
        that:
          - agent_herdr_dir.stat.isdir
          - not agent_herdr_dir.stat.islnk
        fail_msg: "~/.config/herdr must be a real folder, not a symlink into the repo"
        quiet: true

    - name: Check no kitty link was stowed into HOME
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.config/kitty"
      register: agent_kitty

    - name: Assert kitty is not stowed on agent boxes
      ansible.builtin.assert:
        that: not agent_kitty.stat.exists
        fail_msg: "kitty config was stowed on an agent box; it must be excluded"
        quiet: true

    - name: Check pi and pueue on full agent boxes
      ansible.builtin.shell: "command -v {{ item }}"
      args:
        executable: /bin/bash
      environment:
        PATH: "{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.HOME }}/.local/share/mise/shims:{{ ansible_env.PATH }}"
      loop: "{{ agent_bins_full }}"
      register: agent_full_check
      changed_when: false
      failed_when: false
      when: "'debian12-lite' != inventory_hostname"

    - name: Assert pi and pueue present on full agent boxes
      ansible.builtin.assert:
        that: item.rc == 0
        fail_msg: "{{ item.item }} is missing on a full agent box"
        quiet: true
      loop: "{{ agent_full_check.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when: "'debian12-lite' != inventory_hostname"

    - name: Check pi and pueue absent on lite boxes
      ansible.builtin.shell: "command -v {{ item }}"
      args:
        executable: /bin/bash
      environment:
        PATH: "{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.HOME }}/.local/share/mise/shims:{{ ansible_env.PATH }}"
      loop: "{{ agent_bins_full }}"
      register: agent_lite_check
      changed_when: false
      failed_when: false
      when: "'debian12-lite' == inventory_hostname"

    - name: Assert pi and pueue absent on lite boxes
      ansible.builtin.assert:
        that: item.rc != 0
        fail_msg: "{{ item.item }} is installed on a lite box; it must be skipped"
        quiet: true
      loop: "{{ agent_lite_check.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when: "'debian12-lite' == inventory_hostname"
