# Global mise config — dev CLIs & runtimes previously installed via Homebrew
# (see Brewfile). Stowed from the `mise` package; install with `mise install`.

[tools]
# Runtimes
go = "latest"
node = "lts"
uv = "latest"

# GitHub
gh = "latest"

# Shell
sheldon = "latest"
starship = "latest"

# Editor
"aqua:neovim/neovim" = "latest"
"aqua:tree-sitter/tree-sitter" = "latest"  # nvim-treesitter main compiles parsers with it
"npm:@mermaid-js/mermaid-cli" = "latest"  # snacks.image / diagram.nvim render mermaid via mmdc

# Modern CLI (Rust tools; eza stays in Brewfile: no macOS release binaries)
bat = "latest"
ripgrep = "latest"    # installs the `rg` binary
fd = "latest"
delta = "latest"      # Homebrew formula was `git-delta`
lazygit = "latest"
jj = "latest"
fzf = "latest"
zoxide = "latest"
rtk = "latest"

# Utilities
jq = "latest"
yq = "latest"
