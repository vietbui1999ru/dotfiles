[user]
name = "vietbui99"
email = "buiquocviet99@gmail.com"

[ui]
default-command = "log"
diff-editor = ["nvim", "-c", "DiffEditor $left $right $output"]
diff-instructions = false

[snapshot]
auto-track = "none()"   # explicit `jj file track`, same as the stage-by-path rule

[revset-aliases]
"open()" = "mine() & ~::trunk()"
# Pushed history is immutable: agents may squash and rebase only commits that
# no remote has seen yet. main/master are immutable even before a push.
"immutable_heads()" = "builtin_immutable_heads() | remote_bookmarks() | bookmarks(exact:main) | bookmarks(exact:master)"

[aliases]
tug = ["bookmark", "move", "--from", "heads(::@- & bookmarks())", "--to", "@-"]
