"$schema" = 'https://starship.rs/config-schema.json'

palette = "kitty_sync"

format = """
[╭─](fg:surface2)\
[](surface0)\
$os\
$username\
[](bg:peach fg:surface0)\
$directory\
[](bg:green fg:peach)\
$git_branch\
$git_status\
$git_state\
[](bg:teal fg:green)\
$c\
$rust\
$golang\
$nodejs\
$bun\
$python\
$conda\
[](fg:teal)\
$fill\
$shlvl\
$sudo\
$kubernetes\
$docker_context\
$direnv\
${custom.db}\
${custom.aws}\
$package\
$git_commit\
$cmd_duration\
$status\
$jobs\
$git_metrics\
$time\
[─╮](fg:surface2)\
$line_break\
[╰─](fg:surface2)$character"""

add_newline = true
command_timeout = 1000

[os]
disabled = false
style = "bg:surface0 fg:text"

[os.symbols]
Macos = "󰀵 "
Linux = " "

[username]
show_always = false
style_user = "bg:surface0 fg:text"
style_root = "bg:surface0 fg:red"
format = '[ 󰀄 $user ]($style)'
disabled = false

[directory]
style = "bg:peach fg:base"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false

[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = " Downloads"
"Music" = "󰝚 Music"
"Pictures" = " Pictures"
"repos" = "󰲋 repos"
"dotfiles" = " dotfiles"

# ── Git (green segment) ───────────────────────────────────────
[git_branch]
symbol = " "
style = "bg:green fg:base"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:green fg:base"
format = '[$all_status$ahead_behind ]($style)'
# $all_status: $conflicted $stashed $deleted $renamed $modified $staged $untracked
# $ahead_behind: $ahead $behind $diverged $up_to_date
ahead      = "↑${count}"          # ahead of remote
behind     = "↓${count}"          # behind remote
diverged   = "⇅↑${ahead_count}↓${behind_count}"  # both ahead and behind
stashed    = "⚑${count}"          # stashed entries (flag = saved aside)
modified   = "~${count}"          # unstaged edits (tilde = approximate/changed)
staged     = "▲${count}"          # in index (up-triangle = lifted to stage)
untracked  = "…${count}"          # new files not yet tracked
deleted    = "✖${count}"          # removed files
conflicted = "≠${count}"          # merge conflicts (not-equal = disagreement)

# shows REBASING 3/7, MERGING, CHERRY-PICKING, BISECTING, REVERTING — only during active operation
[git_state]
style = "bg:green fg:base bold"
format = '[   $state( $progress_current/$progress_total) ]($style)'

# ── Language / runtime (teal segment) ────────────────────────
[nodejs]
symbol = " "
style = "bg:teal fg:base"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = "󰟓 "
style = "bg:teal fg:base"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:teal fg:base"
format = '[ $symbol ($version) ( $virtualenv) ]($style)'  # $virtualenv shows active venv name

[conda]
symbol = "󱔎 "
style = "bg:teal fg:base"
format = '[ $symbol$environment ]($style)'
ignore_base = true   # hide when env is "base"

[rust]
symbol = " "
style = "bg:teal fg:base"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = " "
style = "bg:teal fg:base"
format = '[ $symbol ($version) ]($style)'

[c]
symbol = "󰙱 "
style = "bg:teal fg:base"
format = '[ $symbol ($version) ]($style)'

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'

# ── Right-side cluster ────────────────────────────────────────
[fill]
symbol = "─"
style = "fg:surface1"

# shell nesting depth — only shows at threshold 2+ (inside nix-shell, poetry shell, etc.)
[shlvl]
disabled = false
symbol = "󰌒 "
style = "fg:overlay1"
format = '[$symbol$shlvl ]($style)'
threshold = 2

# red icon when sudo credentials are cached (sudo -v)
[sudo]
disabled = false
symbol = "󰡴 "
style = "fg:red"
format = '[$symbol ]($style)'

# kubectl context + namespace — only when kubeconfig is active
[kubernetes]
disabled = false
symbol = "󱃾 "
style = "fg:blue"
format = '[$symbol$context( \($namespace\)) ]($style)'

# active Docker context — only shows when Dockerfile/compose.yml present
[docker_context]
symbol = " "
style = "fg:sky"
format = '[$symbol$context ]($style)'
only_with_files = true

# .envrc status — only shows inside a direnv-managed directory
[direnv]
disabled = false
symbol = "󰔍 "
style = "fg:yellow"
format = '[$symbol$loaded/$allowed ]($style)'

# DB: shows protocol (postgres/mysql/sqlite) only when DATABASE_URL is set
# AND the repo has db artifacts (migrations dir, compose, prisma, etc.)
[custom.db]
command = 'printf "%s" "${DATABASE_URL%%:*}"'
when = '[ -n "${DATABASE_URL:-}" ] && { [ -f docker-compose.yml ] || [ -f docker-compose.yaml ] || [ -d migrations ] || [ -d db ] || [ -f prisma/schema.prisma ] || [ -f database.yml ] || [ -f alembic.ini ]; }'
symbol = "󰆼 "
style = "fg:mauve"
format = '[$symbol$output ]($style)'

# AWS: shows active profile only when AWS_PROFILE is set
# AND the repo has IaC/deploy artifacts (.terraform, *.tf, serverless.yml, cdk.json, etc.)
[custom.aws]
command = 'printf "%s" "${AWS_PROFILE:-}"'
when = '[ -n "${AWS_PROFILE:-}" ] && { [ -d .terraform ] || [ -f serverless.yml ] || [ -f cdk.json ] || [ -f samconfig.toml ] || find . -maxdepth 1 -name "*.tf" | grep -q .; }'
symbol = "󰸏 "
style = "fg:yellow"
format = '[$symbol$output ]($style)'

# package version from manifest (package.json, Cargo.toml, pyproject.toml, go.mod …)
[package]
symbol = "󰏗 "
style = "fg:peach"
format = '[$symbol$version ]($style)'

# short commit hash + tag at HEAD; always shown (not just on detached HEAD)
[git_commit]
commit_hash_length = 7
only_detached = false
tag_symbol = " 󰓻 "
style = "fg:overlay2"
format = '[$hash$tag ]($style)'

# last command runtime
[cmd_duration]
min_time = 500
min_time_to_notify = 120000
show_notifications = true
style = "fg:yellow"
format = '[ 󱎫 $duration ]($style)'

# exit code — shows only on failure
[status]
disabled = false
symbol = "✘ "
style = "fg:red"
format = '[ $symbol$status ]($style)'

# backgrounded jobs
[jobs]
symbol = "󰃖 "
style = "fg:sky"
format = '[$symbol$number ]($style)'

# +added / -removed lines in working tree
[git_metrics]
disabled = false
added_style = "fg:green"
deleted_style = "fg:red"
format = '([+$added ]($added_style))([-$deleted ]($deleted_style))'

# clock
[time]
disabled = false
time_format = "%H:%M"
style = "fg:lavender"
format = '[ 󰥔 $time ]($style)'

[palettes.kitty_sync]
rosewater = "#d68292"
flamingo  = "#e76d6b"
pink      = "#da7d8a"
mauve     = "#d3869b"
red       = "#ea6962"
maroon    = "#e9735c"
peach     = "#e87b57"
yellow    = "#e78a4e"
green     = "#a9b665"
teal      = "#99b574"
sky       = "#89b482"
sapphire  = "#84b191"
blue      = "#7daea3"
lavender  = "#a89a9f"
text      = "#d4be98"
subtext1  = "#bca988"
subtext0  = "#a39378"
overlay2  = "#b8a687"
overlay1  = "#a8977d"
overlay0  = "#988873"
surface2  = "#877968"
surface1  = "#766b5e"
surface0  = "#665c54"
base      = "#32302f"
mantle    = "#2a2928"
crust     = "#232221"
